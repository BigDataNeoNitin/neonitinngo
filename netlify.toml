[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/donate"
  to = "/get-involved.html#donate"
  status = 301

[[redirects]]
  from = "/volunteer"
  to = "/get-involved.html#volunteer"
  status = 301
